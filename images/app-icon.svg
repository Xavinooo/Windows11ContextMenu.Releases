<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B8FE0"/>
      <stop offset="1" stop-color="#0067C0"/>
    </linearGradient>
  </defs>
  <!-- soft Fluent drop shadow -->
  <rect x="26" y="30" width="208" height="208" rx="32" fill="#000000" opacity="0.16"/>
  <!-- the menu card -->
  <rect x="24" y="20" width="208" height="208" rx="32" fill="url(#card)" stroke="#B4C0CE" stroke-width="4"/>
  <!-- line 1 -->
  <rect x="56" y="58" width="144" height="20" rx="10" fill="#8A97A6"/>
  <!-- line 2, highlighted like the hovered item -->
  <rect x="40" y="102" width="176" height="48" rx="14" fill="url(#accent)"/>
  <rect x="60" y="116" width="120" height="20" rx="10" fill="#FFFFFF"/>
  <!-- line 3 -->
  <rect x="56" y="172" width="112" height="20" rx="10" fill="#8A97A6"/>
</svg>
