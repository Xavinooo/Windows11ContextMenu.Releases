name: Report a bug
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: About page (for example 1.2.0).
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Windows key + R, “winver” (for example 25H2, build 26200).
    validations:
      required: true
  - type: dropdown
    id: menu
    attributes:
      label: Default menu
      options:
        - Modern
        - Classic
        - Custom
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and actual result
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Turn on Settings > Diagnostic log, reproduce the problem, then paste %LocalAppData%\Win11ContextMenu\shell.log (the last lines are enough).
      render: text
